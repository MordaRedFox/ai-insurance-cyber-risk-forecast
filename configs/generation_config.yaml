# Параметры генерации расходов на кибербезопасность
security_spend:
  base_share:
    finance: 0.03
    retail: 0.02
    manufacturing: 0.015
    healthcare: 0.025
    it_telecom: 0.035
    other: 0.01
  noise_sigma: 0.5

# Коэффициенты для генерации целевой переменной Y0
target_coefficients:
  intercept: 0.5
  beta_revenue: 0.4
  beta_intangible: 0.1
  beta_employees: 0.1
  beta_online_share: 0.2
  beta_security_spend: -0.05
  beta_servers: 0.15
  beta_cloud_share: 0.05
  beta_critical_apps: 0.1
  beta_iot_ot: 0.1
  beta_has_policy: -0.1
  beta_pentest: 0.05
  beta_has_soc: -0.15
  beta_training: -0.05
  beta_has_irp: -0.1
  # Отраслевые коэффициенты
  industry_finance: 0.3
  industry_retail: 0.1
  industry_manufacturing: 0.0
  industry_healthcare: 0.25
  industry_it_telecom: 0.15
  # Другие признаки
  beta_personal_data: 0.15
  beta_incidents_3y: 0.25
  beta_past_loss: 0.3
  beta_past_payout: 0.2
  beta_has_insurance: -0.05
  beta_network_seg: -0.1
  beta_has_eol: 0.3
  beta_downtime_hour_loss: 0.15
  beta_mtd: 0.1
  # Взаимодействия (усиливают эффекты)
  beta_interaction_eol_servers: 0.1
  beta_interaction_online_revenue: 0.05
  beta_interaction_downtime_mtd: 0.15
  beta_interaction_seg_servers: -0.05

# Шум для целевой переменной
noise_std: 0.3

# Доля компаний с нулевым ущербом
zero_loss_prob: 0.15
